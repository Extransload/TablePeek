# The client side of the mongodb-kerberos test profile. Point KRB5_CONFIG
# here (and KRB5CCNAME at a cache of the test's own), so the system's
# Kerberos settings and tickets stay untouched:
#
#   export KRB5_CONFIG=$PWD/testdb/kerberos/krb5.conf
#   export KRB5CCNAME=FILE:/tmp/tablepeek-krb5cc
#   echo ann_krb_pw | kinit --password-file=STDIN ann@TABLEPEEK.TEST   # macOS
#   echo ann_krb_pw | kinit ann@TABLEPEEK.TEST                          # MIT
#
# The KDC listens on 127.0.0.1:1088, UDP and TCP: Heimdal (macOS) asks over
# UDP, MIT over TCP (udp_preference_limit). MIT does not take Heimdal's
# `tcp/` prefix in `kdc`, and Heimdal ignores udp_preference_limit.
[libdefaults]
    default_realm = TABLEPEEK.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    udp_preference_limit = 1

[realms]
    TABLEPEEK.TEST = {
        kdc = 127.0.0.1:1088
    }

[domain_realm]
    .tablepeek.test = TABLEPEEK.TEST
    tablepeek.test = TABLEPEEK.TEST
