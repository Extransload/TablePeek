# Throwaway databases for TablePeek's live tests and for trying the app on
# real servers. Start one engine or several with `make test-db ENGINE=…`.
#
# Every port is bound to 127.0.0.1 only. These accounts are the ones the
# engine tests expect (crates/tablepeek-engine/src/lib.rs) and exist nowhere
# else: never reuse them on a real server. Nothing is kept on a volume, so
# `make test-db-down` throws the data away.
name: tablepeek-testdb

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: tablepeek
      POSTGRES_PASSWORD: tablepeek_test_pw
      POSTGRES_DB: tablepeek_test
    volumes:
      - ./postgres.sql:/docker-entrypoint-initdb.d/10-tests.sql:ro
      - ./postgres-shop.sql:/docker-entrypoint-initdb.d/20-shop.sql:ro
    healthcheck:
      # Over TCP: the server the image runs while seeding listens on a socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tablepeek", "-d", "tablepeek_test"]
      interval: 2s
      retries: 60

  mysql:
    image: mysql:8.0
    ports:
      # 3307 unless TABLEPEEK_TEST_MYSQL_PORT says otherwise (the tests read it too).
      - "127.0.0.1:${TABLEPEEK_TEST_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: tablepeek_test
    volumes:
      - ./mysql.sql:/docker-entrypoint-initdb.d/10-tests.sql:ro
      - ./mysql-shop.sql:/docker-entrypoint-initdb.d/20-shop.sql:ro
    healthcheck:
      # Over TCP: the server the image runs while seeding skips networking.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pw", "--silent"]
      interval: 2s
      retries: 90

  cockroach:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    ports:
      - "127.0.0.1:26258:26257"
    volumes:
      # Seeded by `make test-db`; the image runs no init scripts of its own here.
      # The whole folder, so an edited seed reaches a running container (a
      # mounted single file would keep pointing at the one it replaced).
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 2s
      retries: 60

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # No arm64 build: Apple Silicon runs it under emulation, so it starts slowly.
    platform: linux/amd64
    ports:
      - "127.0.0.1:14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: MsSql_test_pw1
    volumes:
      # Seeded by `make test-db`; the image has no init scripts. The whole
      # folder, as for cockroach.
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "MsSql_test_pw1", "-Q", "SELECT 1"]
      interval: 5s
      retries: 60
      start_period: 20s

  mongodb:
    image: mongo:7
    # A one-member replica set, so transactions, change streams and
    # $indexStats behave as on a production deployment. `make test-db`
    # initiates it and seeds it; authorization stays off, but the test
    # account exists, so password logins are exercised too.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # The services below are in profiles, so plain `make test-db` leaves them
  # out; name one in ENGINE (`make test-db ENGINE=mongodb-rs`) to start it.

  # TLS required and X.509 logins. `make test-db` first writes a throwaway
  # CA, server and client certificate under testdb/x509 (gen.sh); the
  # client's subject is the $external user the init script creates.
  mongodb-x509:
    image: mongo:7
    profiles: [mongodb-x509]
    command:
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /certs/server.pem
      - --tlsCAFile
      - /certs/ca.pem
      - --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: tablepeek
      MONGO_INITDB_ROOT_PASSWORD: tablepeek_test_pw
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - ./x509:/certs:ro
      - ./mongodb-x509.js:/docker-entrypoint-initdb.d/10-x509.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--tls", "--tlsCAFile", "/certs/ca.pem", "--tlsCertificateKeyFile", "/certs/client.pem", "--host", "localhost", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # MongoDB Enterprise checking PLAIN logins against OpenLDAP. The directory
  # holds uid=ann (password ann_ldap_pw); `make test-db` gives her a
  # $external user. Enterprise Server is for evaluation and development
  # only without a subscription, as here.
  openldap:
    image: osixia/openldap:1.5.0
    profiles: [mongodb-ldap]
    # Copy the mounted bootstrap folder rather than writing into it.
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: TablePeek
      LDAP_DOMAIN: tablepeek.test
      LDAP_ADMIN_PASSWORD: ldap_admin_pw
    volumes:
      - ./ldap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-people.ldif:ro
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost", "-D", "uid=ann,ou=people,dc=tablepeek,dc=test", "-w", "ann_ldap_pw"]
      interval: 2s
      retries: 60

  mongodb-ldap:
    image: mongodb/mongodb-enterprise-server:7.0-ubuntu2204
    profiles: [mongodb-ldap]
    depends_on:
      openldap:
        condition: service_healthy
    command:
      - mongod
      - --bind_ip_all
      - --setParameter
      - authenticationMechanisms=PLAIN,SCRAM-SHA-256
      - --ldapServers
      - openldap:389
      - --ldapTransportSecurity
      - none
      - --ldapBindMethod
      - simple
      - --ldapUserToDNMapping
      - '[{match: "(.+)", substitution: "uid={0},ou=people,dc=tablepeek,dc=test"}]'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: tablepeek
      MONGODB_INITDB_ROOT_PASSWORD: tablepeek_test_pw
    ports:
      - "127.0.0.1:27021:27017"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # MongoDB Enterprise taking GSSAPI (Kerberos) logins, with an MIT KDC for
  # the realm TABLEPEEK.TEST on 127.0.0.1:1088 (UDP and TCP). The KDC writes
  # the server's keytab to a volume both share (testdb/kerberos/kdc.sh); the
  # server calls itself kerberos.tablepeek.test, so clients ask for the
  # service principal mongodb/kerberos.tablepeek.test whatever address they
  # dial. `make test-db` gives ann@TABLEPEEK.TEST a $external user.
  kdc:
    build:
      context: ./kerberos
      dockerfile_inline: |
        FROM debian:bookworm-slim
        RUN apt-get update \
          && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends krb5-kdc krb5-admin-server \
          && rm -rf /var/lib/apt/lists/*
    image: tablepeek-testdb-kdc
    profiles: [mongodb-kerberos]
    command: ["sh", "/kerberos/kdc.sh"]
    ports:
      - "127.0.0.1:1088:88/udp"
      - "127.0.0.1:1088:88/tcp"
    volumes:
      - ./kerberos:/kerberos:ro
      - kerberos-keytab:/keytab
    healthcheck:
      test: ["CMD", "test", "-s", "/keytab/mongodb.keytab"]
      interval: 2s
      retries: 60

  mongodb-kerberos:
    # The image lacks the Cyrus SASL GSSAPI plugin the server's Kerberos
    # logins go through.
    build:
      context: ./kerberos
      dockerfile_inline: |
        FROM mongodb/mongodb-enterprise-server:7.0-ubuntu2204
        USER root
        RUN apt-get update \
          && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libsasl2-modules-gssapi-mit \
          && rm -rf /var/lib/apt/lists/*
        USER mongodb
    image: tablepeek-testdb-mongodb-kerberos
    profiles: [mongodb-kerberos]
    depends_on:
      kdc:
        condition: service_healthy
    hostname: kerberos.tablepeek.test
    command:
      - mongod
      - --bind_ip_all
      - --setParameter
      - authenticationMechanisms=GSSAPI,SCRAM-SHA-256
      - --setParameter
      - saslHostName=kerberos.tablepeek.test
    # The client's krb5.conf, for its default realm (the server never asks
    # the KDC anything; the keytab is enough).
    environment:
      KRB5_CONFIG: /seed/kerberos/krb5.conf
      KRB5_KTNAME: /keytab/mongodb.keytab
      MONGODB_INITDB_ROOT_USERNAME: tablepeek
      MONGODB_INITDB_ROOT_PASSWORD: tablepeek_test_pw
    ports:
      - "127.0.0.1:27022:27017"
    volumes:
      - ./:/seed:ro
      - kerberos-keytab:/keytab:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # MongoDB Enterprise taking MONGODB-OIDC logins from a local identity
  # provider (mock-oauth2-server, issuer https://127.0.0.1:8180/tablepeek):
  # its login page takes any user name, and the authorization-code flow
  # with PKCE as well as client credentials hand out tokens for the
  # audience `tablepeek`. MongoDB reads the provider's keys over HTTPS
  # only, so the provider serves the certificate testdb/x509/gen.sh writes
  # (localhost, 127.0.0.1) and the server trusts that CA alone. The server
  # shares the provider's network, so the issuer address is the same inside
  # and on the host (the token's `iss` must match); its port is published
  # here too. `make test-db` gives the browser user tp/ann and the machine
  # identity tp/tablepeek-machine $external users.
  oidc-idp:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    profiles: [mongodb-oidc]
    environment:
      SERVER_PORT: "8180"
      # Every token is for the audience `tablepeek`; the subject is the name
      # typed on the login page, or tablepeek-machine for client credentials
      # (the workload identity of the machine flow).
      JSON_CONFIG: >-
        {"interactiveLogin": true, "httpServer": {"type": "NettyWrapper", "ssl": {
        "keystoreFile": "/certs/idp.p12", "keystoreType": "PKCS12",
        "keystorePassword": "tablepeek", "keyPassword": "tablepeek"}},
        "tokenCallbacks": [{"issuerId": "tablepeek", "requestMappings": [
        {"requestParam": "grant_type", "match": "client_credentials",
        "claims": {"sub": "tablepeek-machine", "aud": ["tablepeek"]}},
        {"requestParam": "grant_type", "match": "*", "claims": {"aud": ["tablepeek"]}}]}]}
    ports:
      - "127.0.0.1:8180:8180"
      - "127.0.0.1:27023:27017"
    volumes:
      - ./x509:/certs:ro

  mongodb-oidc:
    image: mongodb/mongodb-enterprise-server:8.0-ubuntu2204
    profiles: [mongodb-oidc]
    network_mode: "service:oidc-idp"
    depends_on: [oidc-idp]
    command:
      - mongod
      - --bind_ip_all
      - --setParameter
      - authenticationMechanisms=MONGODB-OIDC,SCRAM-SHA-256
      - --setParameter
      - 'oidcIdentityProviders=[{"issuer": "https://127.0.0.1:8180/tablepeek", "audience": "tablepeek", "clientId": "tablepeek", "requestScopes": ["profile"], "authNamePrefix": "tp", "useAuthorizationClaim": false, "supportsHumanFlows": true}]'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: tablepeek
      MONGODB_INITDB_ROOT_PASSWORD: tablepeek_test_pw
    volumes:
      - ./:/seed:ro
      - ./x509/ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # MongoDB Enterprise taking MONGODB-AWS logins. The server checks a login
  # by passing the request the client signed on to STS; here a stand-in
  # (testdb/aws/sts.py) that checks the signature for its one test key and
  # answers with the caller's ARN, over HTTPS with the test certificate
  # (testdb/x509/gen.sh), as the server takes only an https:// STS. The
  # server shares the stand-in's network and trusts that CA alone; its port
  # is published here. `make test-db` gives the IAM user and the assumed
  # role $external users.
  aws-sts:
    image: python:3.12-alpine
    profiles: [mongodb-aws]
    command: ["python", "-u", "/aws/sts.py"]
    ports:
      - "127.0.0.1:27024:27017"
    volumes:
      - ./aws:/aws:ro
      - ./x509:/certs:ro

  mongodb-aws:
    image: mongodb/mongodb-enterprise-server:8.0-ubuntu2204
    profiles: [mongodb-aws]
    network_mode: "service:aws-sts"
    depends_on: [aws-sts]
    command:
      - mongod
      - --bind_ip_all
      - --setParameter
      - authenticationMechanisms=MONGODB-AWS,SCRAM-SHA-256
      - --setParameter
      - awsSTSUrl=https://127.0.0.1:8443
    environment:
      MONGODB_INITDB_ROOT_USERNAME: tablepeek
      MONGODB_INITDB_ROOT_PASSWORD: tablepeek_test_pw
    volumes:
      - ./:/seed:ro
      - ./x509/ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # A three-member replica set that only an SSH server can reach: the
  # members go by names (rs1.tablepeek.test, …) that resolve inside this
  # network alone, and the DNS server answers the SRV name
  # rs.tablepeek.test with them. The first member initiates the set from
  # its health check. Host ports 27031-27033 are for a look from outside
  # (directConnection only).
  mongo-rs1:
    image: mongo:7
    profiles: [mongodb-rs]
    command: ["--replSet", "rs1", "--bind_ip_all"]
    # Its own name too, so a read says which member served it
    # (local.startup_log's hostname).
    hostname: rs1.tablepeek.test
    networks:
      default:
        aliases: [rs1.tablepeek.test]
    ports:
      - "127.0.0.1:27031:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs1", members: [
          { _id: 0, host: "rs1.tablepeek.test:27017" },
          { _id: 1, host: "rs2.tablepeek.test:27017" },
          { _id: 2, host: "rs3.tablepeek.test:27017" }] }).ok }
      interval: 2s
      retries: 60

  mongo-rs2:
    image: mongo:7
    profiles: [mongodb-rs]
    command: ["--replSet", "rs1", "--bind_ip_all"]
    # Its own name too, so a read says which member served it
    # (local.startup_log's hostname).
    hostname: rs2.tablepeek.test
    networks:
      default:
        aliases: [rs2.tablepeek.test]
    ports:
      - "127.0.0.1:27032:27017"

  mongo-rs3:
    image: mongo:7
    profiles: [mongodb-rs]
    command: ["--replSet", "rs1", "--bind_ip_all"]
    # Its own name too, so a read says which member served it
    # (local.startup_log's hostname).
    hostname: rs3.tablepeek.test
    networks:
      default:
        aliases: [rs3.tablepeek.test]
    ports:
      - "127.0.0.1:27033:27017"

  # The way in: user tablepeek with the key `make test-db` writes to
  # testdb/ssh (no password), TCP forwarding on.
  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: [mongodb-rs, scylladb-cluster, clickhouse, oracle]
    environment:
      USER_NAME: tablepeek
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - "127.0.0.1:2223:2222"
    volumes:
      - ./ssh:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^AllowTcpForwarding yes' /config/sshd/sshd_config && nc -z localhost 2222"]
      interval: 2s
      retries: 90

  # Answers for tablepeek.test on 127.0.0.1:1053: the SRV and TXT records
  # of rs.tablepeek.test (a DNS server of the tests' own, so no real DNS is
  # touched).
  dns:
    image: coredns/coredns:1.11.3
    profiles: [mongodb-rs]
    command: ["-conf", "/dns/Corefile"]
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
    volumes:
      - ./dns:/dns:ro

  # Atlas Local (mongod with mongot): search and vector search indexes.
  # A one-member replica set without authentication.
  mongodb-atlas:
    image: mongodb/mongodb-atlas-local:7.0
    profiles: [mongodb-atlas]
    ports:
      - "127.0.0.1:27019:27017"
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 3s
      retries: 100

  # A small sharded cluster: a config server, one shard (each a one-member
  # replica set that initiates itself from its health check) and mongos on
  # 27040. `make test-db` adds the shard.
  mongo-cfg:
    image: mongo:7
    profiles: [mongodb-sharded]
    command: ["--configsvr", "--replSet", "cfg", "--bind_ip_all", "--port", "27017"]
    networks:
      default:
        aliases: [cfg.tablepeek.test]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status().ok } catch (e) { rs.initiate({ _id: "cfg", configsvr: true,
          members: [{ _id: 0, host: "cfg.tablepeek.test:27017" }] }).ok }
      interval: 2s
      retries: 60

  mongo-shard1:
    image: mongo:7
    profiles: [mongodb-sharded]
    command: ["--shardsvr", "--replSet", "sh1", "--bind_ip_all", "--port", "27017"]
    networks:
      default:
        aliases: [sh1.tablepeek.test]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status().ok } catch (e) { rs.initiate({ _id: "sh1",
          members: [{ _id: 0, host: "sh1.tablepeek.test:27017" }] }).ok }
      interval: 2s
      retries: 60

  mongos:
    image: mongo:7
    profiles: [mongodb-sharded]
    depends_on:
      mongo-cfg:
        condition: service_healthy
      mongo-shard1:
        condition: service_healthy
    command: ["mongos", "--configdb", "cfg/cfg.tablepeek.test:27017", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27040:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  # ClickHouse over HTTP (18123) and HTTPS (18443, with the certificate
  # testdb/clickhouse/gen.sh writes for localhost and its name on the test
  # network, clickhouse.tablepeek.test; CA testdb/x509/ca.pem). The SSH
  # server above reaches it by that name for the tunnel tests. The user
  # tablepeek may manage access, so the sessions and users screens have
  # something to do. Seeded by its init scripts on first start:
  # tablepeek_test for the engine tests, shop for trying the app.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [clickhouse]
    mem_limit: 1g
    environment:
      CLICKHOUSE_USER: tablepeek
      CLICKHOUSE_PASSWORD: tablepeek_test_pw
      CLICKHOUSE_DB: tablepeek_test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks:
      default:
        aliases: [clickhouse.tablepeek.test]
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:18443:8443"
    volumes:
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/tablepeek.xml:ro
      - ./clickhouse/certs:/certs:ro
      - ./clickhouse.sql:/docker-entrypoint-initdb.d/10-tests.sql:ro
      - ./clickhouse-shop.sql:/docker-entrypoint-initdb.d/20-shop.sql:ro
    healthcheck:
      # Healthy once the shop seed (whose dictionary comes last) is in.
      test: ["CMD", "clickhouse-client", "--user", "tablepeek", "--password", "tablepeek_test_pw", "--query", "SELECT throwIf(count() = 0) FROM system.dictionaries WHERE database = 'shop'"]
      interval: 2s
      retries: 90

  # Two ClickHouse servers as one cluster, tp_cluster: one shard with both
  # as replicas, ClickHouse Keeper inside ch-node1. HTTP on 18124 and 18125,
  # user tablepeek / tablepeek_test_pw; nothing seeded. For ON CLUSTER.
  ch-node1:
    image: clickhouse/clickhouse-server:25.8
    profiles: [clickhouse-cluster]
    hostname: ch-node1
    mem_limit: 768m
    environment: &ch-node
      CLICKHOUSE_USER: tablepeek
      CLICKHOUSE_PASSWORD: tablepeek_test_pw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CH_REPLICA: ch-node1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "127.0.0.1:18124:8123"
    volumes:
      - ./clickhouse/cluster/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/cluster/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "tablepeek", "--password", "tablepeek_test_pw", "--query", "SELECT throwIf(count() = 0) FROM system.zookeeper WHERE path = '/'"]
      interval: 2s
      retries: 90

  ch-node2:
    image: clickhouse/clickhouse-server:25.8
    profiles: [clickhouse-cluster]
    hostname: ch-node2
    mem_limit: 768m
    environment:
      <<: *ch-node
      CH_REPLICA: ch-node2
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "127.0.0.1:18125:8123"
    volumes:
      - ./clickhouse/cluster/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    depends_on:
      ch-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "tablepeek", "--password", "tablepeek_test_pw", "--query", "SELECT throwIf(count() = 0) FROM system.zookeeper WHERE path = '/'"]
      interval: 2s
      retries: 90

  # Elasticsearch 8 with security on (user elastic / tablepeek_test_pw) and
  # HTTP TLS off, on 9201. Heap 512 MB, machine learning off. Seeded by
  # `make test-db` (testdb/search-shop.sh): the shop indices, aliases and a
  # data stream. The node publishes 127.0.0.1:9201 as its HTTP address, so
  # the node list a connection reads (`_nodes/http`) can be reached.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    profiles: [elasticsearch]
    mem_limit: 1200m
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: tablepeek_test_pw
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9201"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:tablepeek_test_pw 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 60
      start_period: 20s

  # The same with HTTPS on 9203: a node certificate for localhost and
  # 127.0.0.1 signed by the test CA (testdb/x509/ca.pem, made by
  # testdb/elasticsearch-tls/gen.sh), client certificates optional and a
  # PKI realm that maps testdb/x509/client.pem (CN=tablepeek-client) to
  # superuser beside the native one.
  elasticsearch-tls:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    profiles: [elasticsearch-tls]
    mem_limit: 1200m
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: tablepeek_test_pw
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.certificate: certs/node.crt
      xpack.security.http.ssl.key: certs/node.key
      xpack.security.http.ssl.certificate_authorities: certs/ca.pem
      xpack.security.http.ssl.client_authentication: optional
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.authc.realms.native.native1.order: "0"
      xpack.security.authc.realms.pki.pki1.order: "1"
      # The PKI realm needs more than the basic license.
      xpack.license.self_generated.type: trial
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9203"
    ports:
      - "127.0.0.1:9203:9200"
    volumes:
      - ./:/seed:ro
      - ./elasticsearch-tls/certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert config/certs/ca.pem -u elastic:tablepeek_test_pw 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 60
      start_period: 20s

  # Elasticsearch 7.9 (no point in time: exports and the cursor-less paths
  # read by scroll), security on, HTTP on 9204.
  elasticsearch-7:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.9.3
    profiles: [elasticsearch-7]
    mem_limit: 1200m
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: tablepeek_test_pw
      xpack.security.enabled: "true"
      # API keys are off by default before 8.0.
      xpack.security.authc.api_key.enabled: "true"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9204"
    ports:
      - "127.0.0.1:9204:9200"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:tablepeek_test_pw 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 60
      start_period: 20s

  # Elasticsearch 6.8, the last with mapping types (the seed's indices are
  # made typeless, as `_doc`), security on (basic license), HTTP on 9206.
  # Only an x86-64 image exists: it runs emulated on ARM machines.
  elasticsearch-6:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    platform: linux/amd64
    profiles: [elasticsearch-6]
    # Emulation (x86-64 on ARM) needs room beyond the 512 MB heap.
    mem_limit: 1600m
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: tablepeek_test_pw
      xpack.security.enabled: "true"
      xpack.security.authc.api_key.enabled: "true"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9206"
      # API keys need more than 6.8's basic license.
      xpack.license.self_generated.type: trial
    ports:
      - "127.0.0.1:9206:9200"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:tablepeek_test_pw 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 5s
      retries: 60
      start_period: 60s

  # OpenSearch 2 with its security plugin's demo setup: HTTPS on 9202 with a
  # self-signed certificate (the tests pin its fingerprint or skip the
  # check) and admin / TablePeek_test_pw1. Heap 512 MB. Seeded like
  # elasticsearch.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: [opensearch]
    mem_limit: 1200m
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: TablePeek_test_pw1
      plugins.ml_commons.only_run_on_ml_node: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9202"
    ports:
      - "127.0.0.1:9202:9200"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u admin:TablePeek_test_pw1 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 80
      start_period: 30s

  # OpenSearch 1.3 (no point in time before 2.4) with the demo security
  # setup of its day: HTTPS on 9205, admin / admin.
  opensearch-1:
    image: opensearchproject/opensearch:1.3.20
    profiles: [opensearch-1]
    mem_limit: 1200m
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9205"
    ports:
      - "127.0.0.1:9205:9200"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u admin:admin 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 80
      start_period: 30s

  # OpenSearch 3.9 with the demo security setup and API keys (3.7 and
  # later) switched on: testdb/opensearch-3/config.yml is the image's
  # security config with `api_tokens.enabled: true`. HTTPS on 9207,
  # admin / TablePeek_test_pw1.
  opensearch-3:
    image: opensearchproject/opensearch:3.9.0
    profiles: [opensearch-3]
    mem_limit: 1400m
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: TablePeek_test_pw1
      plugins.ml_commons.only_run_on_ml_node: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      http.publish_host: 127.0.0.1
      http.publish_port: "9207"
    ports:
      - "127.0.0.1:9207:9200"
    volumes:
      - ./:/seed:ro
      - ./opensearch-3/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u admin:TablePeek_test_pw1 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 80
      start_period: 30s

  # Cassandra 5 with logins on (cassandra / cassandra, and the seed's
  # tablepeek / tablepeek_test_pw), Java UDFs and materialized views
  # enabled, on 9043. Heap 512 MB. Seeded by `make test-db`
  # (cassandra-keyspaces.cql, cassandra-shop.cql, cassandra-extras.cql).
  # Run one CQL server at a time: both are heavy.
  cassandra:
    image: cassandra:5
    profiles: [cassandra]
    mem_limit: 1200m
    # Two CPUs and bounded off-heap memory: on a many-core machine the JVM
    # would size thread pools, GC threads and direct buffers past the cap.
    cpus: 2
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      JVM_EXTRA_OPTS: -XX:MaxDirectMemorySize=128m -Xss256k -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=192m
      CASSANDRA_CLUSTER_NAME: tablepeek
    entrypoint:
      - sh
      - -c
      - >-
        sed -i
        -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/'
        -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/'
        -e 's/^user_defined_functions_enabled:.*/user_defined_functions_enabled: true/'
        -e 's/^materialized_views_enabled:.*/materialized_views_enabled: true/'
        /etc/cassandra/cassandra.yaml
        && exec docker-entrypoint.sh cassandra -f
    ports:
      - "127.0.0.1:9043:9042"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "SELECT release_version FROM system.local"]
      interval: 5s
      retries: 60
      start_period: 40s

  # ScyllaDB on one shard with 512 MB, logins on and Lua UDFs, on 9044.
  # Recent ScyllaDB makes no default superuser: `make test-db` seeds over
  # the maintenance socket (/var/lib/scylla/cql.m, no login), which makes
  # the tablepeek / tablepeek_test_pw superuser (scylladb-keyspaces.cql),
  # then cassandra-shop.cql and scylladb-extras.cql.
  scylladb:
    image: scylladb/scylla:latest
    profiles: [scylladb]
    mem_limit: 1g
    command:
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
      - --authenticator
      - PasswordAuthenticator
      - --authorizer
      - CassandraAuthorizer
      - --experimental-features
      - udf
      - --enable-user-defined-functions
      - "true"
    ports:
      - "127.0.0.1:9044:9042"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "cqlsh", "/var/lib/scylla/cql.m", "-e", "SELECT release_version FROM system.local"]
      interval: 5s
      retries: 60
      start_period: 30s

  # A two-node ScyllaDB cluster (256 MB each) reached only through the SSH
  # server above, for tunnels that must lead to every node. `make test-db
  # ENGINE=scylladb-cluster` seeds it like scylladb, on scylla-a.
  scylla-a: &scylla-node
    image: scylladb/scylla:latest
    profiles: [scylladb-cluster]
    mem_limit: 600m
    command: [--seeds, scylla-a, --smp, "1", --memory, 256M, --overprovisioned, "1", --developer-mode, "1", --authenticator, PasswordAuthenticator, --authorizer, CassandraAuthorizer, --experimental-features, udf, --enable-user-defined-functions, "true"]
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "cqlsh", "/var/lib/scylla/cql.m", "-e", "SELECT release_version FROM system.local"]
      interval: 5s
      retries: 60
      start_period: 30s
  scylla-b:
    <<: *scylla-node
    depends_on:
      scylla-a:
        condition: service_healthy

  # Oracle Database 23ai Free (the slim image with a ready-made database;
  # native arm64 too) on 15210, service FREEPDB1. `make test-db` first
  # shrinks its SGA and PGA to fit the cap (oracle-memory.sql, one restart),
  # then seeds the TABLEPEEK schema the tests read (oracle.sql) and the SHOP
  # sample (oracle-shop.sql) as SYS (password Oracle_test_pw1), and opens a
  # TCPS listener on 15211 with the wallet oracle-wallet.sh made
  # (oracle-tls.sh; certificate for localhost and 127.0.0.1 from x509/).
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: [oracle]
    mem_limit: 2500m
    environment:
      ORACLE_PASSWORD: Oracle_test_pw1
    ports:
      - "127.0.0.1:15210:1521"
      - "127.0.0.1:15211:2484"
    volumes:
      - ./:/seed:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60
      start_period: 20s

# The keytab the KDC writes for the Kerberos test server.
volumes:
  kerberos-keytab:
