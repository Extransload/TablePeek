[package]
name = "tablepeek"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "tablepeek"
path = "src/main.rs"

[dependencies]
tablepeek-engine = { path = "../tablepeek-engine" }
tablepeek-server = { path = "../tablepeek-server" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json.workspace = true
tokio = { workspace = true }
uuid = { workspace = true }

# Kerberos (GSSAPI) MongoDB logins off macOS; see tablepeek-engine.
[features]
kerberos = ["tablepeek-engine/kerberos"]
