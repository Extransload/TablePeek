[package]
name = "tablepeek-desktop"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# The desktop app is made for macOS and Windows only; elsewhere the binary
# just says so, and the workspace builds there without a webview toolkit.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
async-trait = "0.1"
# `tauri::generate_context!` writes the plugins' settings as serde_json values.
serde_json.workspace = true
tablepeek-server = { path = "../tablepeek-server" }
# `macos-private-api` lets a macOS window and its webview be transparent, for
# the glass and clear window materials (see material.rs).
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
tokio = { workspace = true }

# The window number the clear material's blur is set by (see material.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Reads tauri.conf.json at build time; the build script calls it only for
# macOS and Windows targets.
[build-dependencies]
tauri-build = { version = "2.7", features = [] }
