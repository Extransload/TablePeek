[package]
name = "tablepeek-server"
version = "0.0.1"
edition = "2021"

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = { workspace = true }
base64 = "0.22"
futures-util = "=0.3.32"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tablepeek-engine = { path = "../tablepeek-engine" }
tablepeek-types = { path = "../tablepeek-types" }
russh = "0.64"
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
uuid.workspace = true
