[package]
name = "tablepeek-server"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# The tunnels a replica set's members are reached through implement the
# engine's `Forwarder` (the version the engine already uses).
async-trait = "0.1"
axum = { workspace = true }
base64 = "0.22"
fontdb = "0.24"
futures-util = { version = "=0.3.32", features = ["io"] }
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tablepeek-engine = { path = "../tablepeek-engine" }
tablepeek-types = { path = "../tablepeek-types" }
# The update check: GitHub's latest release over HTTPS with the system's
# roots (the client the engine already uses), and its tag compared as SemVer.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
semver = "1"
russh = "0.64"
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["io-util"] }
uuid.workspace = true
