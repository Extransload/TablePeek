[workspace]
resolver = "2"
members = [
    "crates/tablepeek",
    "crates/tablepeek-engine",
    "crates/tablepeek-server",
    "crates/tablepeek-types",
]
# Vendored with TablePeek's changes (see its Cargo.toml); not a member, so
# workspace fmt and clippy leave Oracle's source as published.
exclude = ["crates/vendor/oracledb"]

# The one version every crate takes; web/package.json carries the same
# number (`make check` compares them, `make version V=x.y.z` bumps both).
[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Extransload/TablePeek"

[patch.crates-io]
oracledb = { path = "crates/vendor/oracledb" }

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

# Deriving the key for an exported connections file takes seconds unoptimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
