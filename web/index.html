<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WrenDB</title>
    <script>
      try {
        const prefix = "prodb.";
        const legacy = [];
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index);
          if (key && key.startsWith(prefix)) {
            legacy.push([key, localStorage.getItem(key)]);
          }
        }
        for (const [key, value] of legacy) {
          const next = `wrendb.${key.slice(prefix.length)}`;
          if (localStorage.getItem(next) === null && value !== null) {
            localStorage.setItem(next, value);
          }
          localStorage.removeItem(key);
        }
        const raw = localStorage.getItem("wrendb.settings");
        if (raw !== null) {
          const settings = JSON.parse(raw);
          if (settings && settings.syntaxPreset === "prodb") {
            settings.syntaxPreset = "wrendb";
            localStorage.setItem("wrendb.settings", JSON.stringify(settings));
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
